name: Refresh Universe (Quarterly)

# Rebuilds eligible_universe.json from IWV holdings + SEC fundamentals.
# Cron runs the 15th of Feb / May / Aug / Nov at 07:00 UTC (after peak earnings).
# Also available on-demand via the Actions tab (workflow_dispatch).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 15 2,5,8,11 *'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90     # allow generous runtime; actual is 30-60 min

    permissions:
      contents: write       # needed to commit eligible_universe.json back

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run refresh
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python refresh_universe.py

      - name: Commit updated universe
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eligible_universe.json
          if ! git diff --cached --quiet; then
            git commit -m "Quarterly universe refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit."
          fi
