name: Daily Scan

# Runs the breakout scan Mon-Fri after US market close.
# 22:00 UTC = 23:00 CET (winter) / 00:00 CEST (summer).
# Committed report lands in reports/YYYY-MM-DD.html for weekend review.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify input CSV exists
        run: |
          if [ ! -f input/manual_universe.csv ]; then
            echo "::error::input/manual_universe.csv is missing. See SCREENING.md for how to create it."
            exit 1
          fi

      - name: Build eligible universe from CSV
        run: python build_universe.py

      - name: Run daily scan
        run: python daily_scan.py

      - name: Commit universe, report, and updated history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eligible_universe.json reports/ data/
          if ! git diff --cached --quiet; then
            git commit -m "Daily scan $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit."
          fi
